<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>CRWI Attendance — Offline</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20314f; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid #dbe5f1; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px #20314f14; text-align: center; }
    .mark { width: 48px; height: 48px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 15px; color: #fff; background: #2873e8; font-weight: 800; letter-spacing: .04em; }
    h1 { margin: 0; font-size: 1.35rem; }
    p { margin: 10px 0 22px; color: #65758d; line-height: 1.55; }
    button { border: 0; border-radius: 10px; padding: 11px 18px; color: #fff; background: #2873e8; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CRWI</div>
    <h1>You’re offline</h1>
    <p>Reconnect to the internet to continue using the CRWI Attendance app. Your saved work will be available when the connection returns.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
